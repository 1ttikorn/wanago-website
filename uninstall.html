<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uninstall | WanaGo New Tab</title>
    <link rel="icon" type="image/png" href="WanaGo-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-900 antialiased selection:bg-black selection:text-white">

    <!-- Top Left Logo -->
    <header class="p-6 md:p-8 absolute top-0 left-0">
        <a href="index.html" class="inline-block transition-transform hover:scale-105">
            <img src="WanaGo%20Travel%20Wallpaper%20New%20Tab-Logo.png" alt="WanaGo Logo" class="w-12 h-12 md:w-14 md:h-14 object-contain filter drop-shadow-sm">
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-6">
        
        <!-- Goodbye GIF / Image -->
        <div class="mb-8 rounded-2xl overflow-hidden shadow-sm border border-gray-200">
            <!-- ใส่ลิงก์ GIF หรือรูปภาพที่ต้องการตรง src -->
            <img src="https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif" alt="Goodbye" class="w-[360px] h-[200px] object-cover">
        </div>

        <!-- Headings -->
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-gray-900 text-center mb-4">
            We're sorry to see you go!
        </h1>
        
        <p class="text-base md:text-xl text-gray-500 text-center max-w-lg mb-8 leading-relaxed">
            Help us improve WanaGo by filling out this quick survey.
        </p>

        <!-- CTA Button -->
        <!-- นำลิงก์ Google Form หรือ Typeform มาใส่ตรง href -->
        <a href="#" target="_blank" rel="noopener noreferrer" class="bg-black hover:bg-gray-800 text-white font-medium py-3 px-10 rounded-full transition shadow-md hover:shadow-lg hover:-translate-y-0.5 transform duration-150 text-base md:text-lg">
            Start
        </a>

        <!-- Time Indicator -->
        <div class="flex items-center gap-1.5 text-gray-400 text-sm font-medium mt-4">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Takes 1 minute</span>
        </div>

    </main>

</body>
</html>
