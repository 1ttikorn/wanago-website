<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | WanaGo New Tab</title>
    <link rel="icon" type="image/png" href="WanaGo-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-black selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Top Navigation / Logo -->
    <header class="w-full py-8 px-6 text-center">
        <a href="index.html" class="inline-block transition-transform duration-300 hover:scale-105">
            <img src="WanaGo%20Travel%20Wallpaper%20New%20Tab-Logo.png" alt="WanaGo Logo" class="w-16 h-16 md:w-20 md:h-20 object-contain mx-auto filter drop-shadow-[0_8px_16px_rgba(0,0,0,0.08)]">
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-6 pb-16">
        <div class="max-w-xl mx-auto text-center">
            
            <!-- Headline -->
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-gray-900 mb-6 leading-[1.15]">
                Thank you for traveling with us.
            </h1>
            
            <!-- Description -->
            <p class="text-base md:text-xl text-gray-500 font-normal leading-relaxed mb-10 max-w-lg mx-auto">
                We're sorry to see you go, but we truly appreciate the time you spent with WanaGo. Wishing you endless inspiration and wonderful adventures ahead.
            </p>
            
            <!-- Action Button -->
            <div class="flex items-center justify-center gap-4 flex-wrap">
                <a href="index.html" class="inline-flex items-center justify-center bg-black hover:bg-gray-800 text-white font-medium py-3 px-8 rounded-full transition shadow-[0_4px_14px_rgba(0,0,0,0.15)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.25)] hover:-translate-y-0.5 transform duration-150 text-sm md:text-base">
                    Return to Home
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 text-center text-gray-400 text-xs md:text-sm tracking-wide border-t border-gray-100 bg-white/50">
        <p>&copy; 2026 WanaGo New Tab. Safe travels wherever you go.</p>
    </footer>

</body>
</html>
